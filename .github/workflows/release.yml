# Releases, from conventional commits on main to an immutable, signed GitHub Release.
#
#   release-please  opens or updates the release PR; once it merges, cuts the tag and a *draft*
#   build           macOS, read-only: builds and checks the DMG, writes SHA256SUMS
#   publish         signs the DMG for in-app updates (Ed25519, the `release` environment's
#                   UPDATE_SIGNING_KEY) and SHA256SUMS (cosign, keyless), attests the DMG's
#                   provenance, uploads to the draft, then publishes it. Release immutability (a
#                   repo setting) freezes the assets and the tag from then on, so nothing is
#                   uploaded after this.
#   deploy-site     rebuilds the landing page, whose download button names the new version
#
# The build runs third-party toolchains and dependencies, so it gets no write scope, no OIDC
# token and no secrets; only the small publish job can touch the release.
#
# A stuck draft (failed build or publish): "Re-run failed jobs", or dispatch this workflow with
# the draft's tag.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Draft tag to recover (e.g. v1.0.1); leave empty to reconcile main
        required: false
        type: string
      expected_sha:
        description: Optional tested main commit for an automated batch
        required: false
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.tag == '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # the tag, the draft release, the release branch
      pull-requests: write # the release PR and its labels
      actions: write # dispatching CI on the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Check the tested main commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [ -n "$EXPECTED_SHA" ]; then
            current=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
            if [ "$GITHUB_SHA" != "$EXPECTED_SHA" ] || [ "$current" != "$EXPECTED_SHA" ]; then
              echo "main moved since batch CI; leave the release for the next batch" >&2; exit 1
            fi
          fi
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A PR that GITHUB_TOKEN opens or pushes to starts no workflows, so `ci-ok` would never
      # report on it. A dispatched run is the exception, and its checks land on the PR's head.
      - name: Run CI on the release PR
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.release.outputs.pr }}
        run: gh workflow run ci.yml --ref "$(jq -r .headBranchName <<<"$PR")"

  build:
    needs: release-please
    if: >-
      !cancelled() && !failure() &&
      github.ref == 'refs/heads/main' &&
      (needs.release-please.outputs.release_created == 'true' || inputs.tag != '')
    runs-on: macos-26
    env:
      # Pinned so a runner image's default Xcode moving doesn't change the compiler under us.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check the tag
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "not a release tag: $TAG" >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: Check the tag matches the tested release commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [ -n "$EXPECTED_SHA" ]; then
            [ "$(git rev-parse HEAD)" = "$EXPECTED_SHA" ] || {
              echo "release tag differs from the tested commit" >&2; exit 1;
            }
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: daemon
      - name: Build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: make all dmg BUILD_NUMBER="$BUILD_NUMBER"
      - name: Verify
        run: EXPECTED_VERSION="${TAG#v}" scripts/verify-bundle.sh
      - name: Checksums
        working-directory: build
        run: shasum -a 256 Bridgetown.dmg | tee SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            build/Bridgetown.dmg
            build/SHA256SUMS
          retention-days: 5
          if-no-files-found: error

  publish:
    needs: [release-please, build]
    if: ${{ !cancelled() && !failure() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # UPDATE_SIGNING_KEY lives there, and the environment only deploys from main.
    environment: release
    permissions:
      contents: write # uploading to and publishing the draft
      id-token: write # cosign's and the attestation's keyless signing certificates
      attestations: write # storing the provenance attestation
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist

      - name: Check the release is still a draft
        run: |
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft)
          [ "$draft" = true ] || { echo "$TAG is already published, and published releases are immutable" >&2; exit 1; }

      - name: Check the checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      # What the app checks before it installs an update (app/Sources/Bridgetown/UpdateInstaller.swift):
      # the DMG's bytes, signed with a key whose public half every release ships in Info.plist.
      - name: Sign the DMG for in-app updates
        working-directory: dist
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          [ -n "$UPDATE_SIGNING_KEY" ] || { echo "no UPDATE_SIGNING_KEY in the release environment" >&2; exit 1; }
          umask 077
          key="$RUNNER_TEMP/update-signing-key.pem"
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -inkey "$key" -rawin -in Bridgetown.dmg -out "$RUNNER_TEMP/dmg.sig"
          rm -f "$key"
          base64 -w0 "$RUNNER_TEMP/dmg.sig" > Bridgetown.dmg.sig

      # Against the keys in the tagged source, not ones the build could have swapped: a secret that
      # drifted from Info.plist would publish a release no installed app can update to.
      - name: Check the signature against the app's keys
        working-directory: dist
        run: |
          gh api -H "Accept: application/vnd.github.raw" "repos/$GH_REPO/contents/app/Info.plist?ref=$TAG" \
            | python3 -c 'import plistlib, sys; print("\n".join(plistlib.loads(sys.stdin.buffer.read())["BridgetownUpdatePublicKeys"]))' > "$RUNNER_TEMP/public-keys"
          base64 -d Bridgetown.dmg.sig > "$RUNNER_TEMP/dmg.sig"
          while read -r key; do
            # An Ed25519 SubjectPublicKeyInfo is this prefix, then the key's 32 bytes.
            { printf '302a300506032b6570032100' | xxd -r -p; printf '%s' "$key" | base64 -d; } > "$RUNNER_TEMP/public-key.der"
            if openssl pkeyutl -verify -pubin -keyform DER -inkey "$RUNNER_TEMP/public-key.der" -rawin -in Bridgetown.dmg -sigfile "$RUNNER_TEMP/dmg.sig"; then
              exit 0
            fi
          done < "$RUNNER_TEMP/public-keys"
          echo "UPDATE_SIGNING_KEY matches none of BridgetownUpdatePublicKeys in app/Info.plist at $TAG" >&2
          exit 1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign SHA256SUMS
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - name: Attest the DMG's provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/Bridgetown.dmg

      - name: Release notes
        env:
          WORKFLOW: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@refs/heads/main
        run: |
          gh release view "$TAG" --json body --jq .body > notes.md
          grep -q '^## Verify' notes.md || cat >> notes.md <<EOF

          ## Verify

          \`\`\`sh
          shasum -a 256 -c SHA256SUMS
          cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \\
            --certificate-identity ${WORKFLOW} \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          gh attestation verify Bridgetown.dmg -R ${GH_REPO}
          \`\`\`

          Not notarized yet: on first launch, open **System Settings → Privacy & Security** and click **Open Anyway**.
          EOF

      # --clobber only ever replaces assets on the draft (checked above), e.g. after a re-run.
      - name: Upload to the draft
        run: gh release upload "$TAG" dist/Bridgetown.dmg dist/Bridgetown.dmg.sig dist/SHA256SUMS dist/SHA256SUMS.sigstore.json --clobber

      - name: Publish
        run: gh release edit "$TAG" --notes-file notes.md --draft=false --latest

      - name: Check the release is immutable
        run: |
          immutable=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq .immutable)
          [ "$immutable" = true ] || { echo "$TAG was published mutable: turn on release immutability in the repo settings" >&2; exit 1; }

  deploy-site:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    permissions:
      contents: read
    # A job-level call resolves from this commit, not the runner filesystem; actionlint does not know `$/` yet.
    uses: ./.github/workflows/deploy-site.yml # zizmor: ignore[self-repository]
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
