version: 2
updates:
  # Keeps the SHA-pinned actions current; the `# vX.Y.Z` comments move with them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 7

  # What ships in the app: runtime bumps are `deps`, which release-please releases.
  - package-ecosystem: bun
    directory: /daemon
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
      prefix-development: chore
    groups:
      automatic-patches:
        patterns: [zod, '@types/bun', typescript]
        update-types: [patch]
      minor-and-patch:
        exclude-patterns: [zod, '@types/bun', typescript]
        update-types: [minor, patch]
    cooldown:
      default-days: 7

  # The landing page ships on its own (deploy-site.yml), never as a release.
  - package-ecosystem: bun
    directory: /site
    schedule:
      interval: weekly
    # astro check requires TypeScript 6; remove when the site's checker supports 7+.
    ignore:
      - dependency-name: typescript
        versions: [">=7"]
    commit-message:
      prefix: chore
    groups:
      automatic-patches:
        patterns:
          - '@fontsource-variable/geist'
          - '@fontsource-variable/geist-mono'
          - gsap
          - lenis
          - lucide-static
          - three
          - '@types/bun'
          - '@types/three'
          - playwright-core
          - typescript
        update-types: [patch]
      minor-and-patch:
        exclude-patterns:
          - '@fontsource-variable/geist'
          - '@fontsource-variable/geist-mono'
          - gsap
          - lenis
          - lucide-static
          - three
          - '@types/bun'
          - '@types/three'
          - playwright-core
          - typescript
        update-types: [minor, patch]
    cooldown:
      default-days: 7
